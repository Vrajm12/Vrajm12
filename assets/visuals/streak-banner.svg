<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="196" viewBox="0 0 1200 196" role="img" aria-label="All-time contributions and streak telemetry for Vrajm12">
  <defs>
    <linearGradient id="stk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#0f1b31"/>
    </linearGradient>
    <linearGradient id="stk-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#42d6c5" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#668cff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b58aff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="stk-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42d6c5"/>
      <stop offset="100%" stop-color="#668cff"/>
    </linearGradient>
    <pattern id="stk-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8aa4c8" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="196" rx="18" fill="url(#stk-bg)" stroke="#1f304d" stroke-width="1.2"/>
  <rect width="1200" height="196" rx="18" fill="url(#stk-dots)"/>
  <path d="M 18 0.8 H 1182" stroke="url(#stk-rim)" stroke-width="1.6"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <!-- Panel 1: All-Time Contributions -->
    <g transform="translate(0, 0)">
      <text x="200" y="54" fill="#42d6c5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">ALL-TIME CONTRIBUTIONS</text>
      <text x="200" y="114" fill="#f3f8ff" font-size="46" font-weight="800" text-anchor="middle">606</text>
      <text x="200" y="145" fill="#8ea4c8" font-size="13" text-anchor="middle">Jul 12, 2023 – Present</text>
      <rect x="122" y="158" width="156" height="22" rx="11" fill="#102932" stroke="#42d6c5" stroke-opacity="0.35"/>
      <text x="200" y="173" fill="#8cf0e2" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle">+394 TO 1,000 MILESTONE</text>
    </g>

    <line x1="400" y1="30" x2="400" y2="166" stroke="#1f314f" stroke-width="1.2"/>

    <!-- Panel 2: Active Streak Ring -->
    <g transform="translate(600, 96)">
      <circle cx="0" cy="-6" r="56" fill="#101f36" fill-opacity="0.7"/>
      <circle cx="0" cy="-6" r="48" fill="none" stroke="#1b2d4a" stroke-width="7"/>
      <circle cx="0" cy="-6" r="48" fill="none" stroke="url(#stk-ring)" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="258.5 301.6" transform="rotate(-90 0 -6)"/>
      <!-- Flame badge -->
      <circle cx="0" cy="-54" r="12" fill="#0c1526" stroke="#42d6c5" stroke-width="1.4"/>
      <path d="M0 -61 C3 -56, 5 -54, 5 -51 C5 -48, 2.8 -46, 0 -46 C-2.8 -46, -5 -48, -5 -51 C-5 -53.5, -3 -56, 0 -61 Z" fill="#42d6c5"/>
      <text x="0" y="4" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">12</text>
      <text x="0" y="21" fill="#8cf0e2" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">DAYS</text>
      <text x="0" y="64" fill="#eef4ff" font-size="14" font-weight="700" text-anchor="middle">Current Active Streak</text>
      <text x="0" y="83" fill="#8ea4c8" font-size="12" text-anchor="middle">Nov 15 – Nov 26</text>
    </g>

    <line x1="800" y1="30" x2="800" y2="166" stroke="#1f314f" stroke-width="1.2"/>

    <!-- Panel 3: Longest Streak & YTD -->
    <g transform="translate(800, 0)">
      <text x="200" y="54" fill="#b58aff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">PEAK CONSISTENCY</text>
      <text x="200" y="114" fill="#f3f8ff" font-size="46" font-weight="800" text-anchor="middle">13 <tspan font-size="20" fill="#b8c7e0" font-weight="600">days</tspan></text>
      <text x="200" y="145" fill="#8ea4c8" font-size="13" text-anchor="middle">Longest Streak · Jul 27 – Aug 8, 2026</text>
      <rect x="112" y="158" width="176" height="22" rx="11" fill="#211a38" stroke="#b58aff" stroke-opacity="0.35"/>
      <text x="200" y="173" fill="#dfccff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle">2026 YTD: 465 CONTRIBUTIONS</text>
    </g>
  </g>
</svg>
