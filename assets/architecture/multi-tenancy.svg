<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-label="Zero-Trust Multi-Tenant Request Path">
  <defs>
    <linearGradient id="mt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a13"/>
      <stop offset="52%" stop-color="#0b1323"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="mt-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#42d6c5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#668cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b58aff" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="mt-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8aa4c8" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="255" rx="18" fill="url(#mt-bg)" stroke="#1e304d" stroke-width="1.2"/>
  <rect width="1200" height="255" rx="18" fill="url(#mt-grid)"/>
  <path d="M 18 0.9 H 1182" stroke="url(#mt-rim)" stroke-width="1.8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="34" fill="#42d6c5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="2.2">ISOLATION MODEL // 02</text>
    <text x="30" y="58" fill="#f2f7ff" font-size="18.5" font-weight="800">Zero-Trust Multi-Tenant Request Path</text>
    <text x="1170" y="56" fill="#7f95b8" font-size="12" text-anchor="end">Context resolved once and enforced server-side</text>
    <g transform="translate(30.0, 94)">
      <rect width="210.4" height="118" rx="14" fill="#12223d" stroke="#668cff" stroke-opacity="0.65"/>
      <text x="105.2" y="24" fill="#668cff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">STEP 01</text>
      <text x="105.2" y="50" fill="#dce8ff" font-size="14.5" font-weight="800" text-anchor="middle">INGRESS</text>
      <text x="105.2" y="76" fill="#9eb3d4" font-size="12" text-anchor="middle">Host / Header</text><text x="105.2" y="96" fill="#9eb3d4" font-size="12" text-anchor="middle">Signed Claims</text>
    </g>
    <g transform="translate(262.4, 94)">
      <rect width="210.4" height="118" rx="14" fill="#0f2a32" stroke="#42d6c5" stroke-opacity="0.65"/>
      <text x="105.2" y="24" fill="#42d6c5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">STEP 02</text>
      <text x="105.2" y="50" fill="#b5fff4" font-size="14.5" font-weight="800" text-anchor="middle">RESOLVE</text>
      <text x="105.2" y="76" fill="#9eb3d4" font-size="12" text-anchor="middle">Tenant Lookup</text><text x="105.2" y="96" fill="#9eb3d4" font-size="12" text-anchor="middle">Status Check</text>
    </g>
    <g transform="translate(494.8, 94)">
      <rect width="210.4" height="118" rx="14" fill="#22193a" stroke="#b58aff" stroke-opacity="0.65"/>
      <text x="105.2" y="24" fill="#b58aff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">STEP 03</text>
      <text x="105.2" y="50" fill="#e8d6ff" font-size="14.5" font-weight="800" text-anchor="middle">AUTHORIZE</text>
      <text x="105.2" y="76" fill="#9eb3d4" font-size="12" text-anchor="middle">Role + Permission</text><text x="105.2" y="96" fill="#9eb3d4" font-size="12" text-anchor="middle">Tenant Boundary Guard</text>
    </g>
    <g transform="translate(727.2, 94)">
      <rect width="210.4" height="118" rx="14" fill="#142442" stroke="#668cff" stroke-opacity="0.65"/>
      <text x="105.2" y="24" fill="#668cff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">STEP 04</text>
      <text x="105.2" y="50" fill="#dce8ff" font-size="14.5" font-weight="800" text-anchor="middle">SCOPE QUERY</text>
      <text x="105.2" y="76" fill="#9eb3d4" font-size="12" text-anchor="middle">Mandatory companyId</text><text x="105.2" y="96" fill="#9eb3d4" font-size="12" text-anchor="middle">Prisma / SQL Filter</text>
    </g>
    <g transform="translate(959.6, 94)">
      <rect width="210.4" height="118" rx="14" fill="#0f2a32" stroke="#42d6c5" stroke-opacity="0.65"/>
      <text x="105.2" y="24" fill="#42d6c5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">STEP 05</text>
      <text x="105.2" y="50" fill="#b5fff4" font-size="14.5" font-weight="800" text-anchor="middle">ISOLATED IO</text>
      <text x="105.2" y="76" fill="#9eb3d4" font-size="12" text-anchor="middle">Zero Cross-Tenant Leak</text><text x="105.2" y="96" fill="#9eb3d4" font-size="12" text-anchor="middle">Scoped Cache Keys</text>
    </g>
    <path d="M 243.4 153 H 259.4 m -5 -4.5 l 5 4.5 l -5 4.5" fill="none" stroke="#6882a8" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 475.8 153 H 491.8 m -5 -4.5 l 5 4.5 l -5 4.5" fill="none" stroke="#6882a8" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 708.2 153 H 724.2 m -5 -4.5 l 5 4.5 l -5 4.5" fill="none" stroke="#6882a8" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 940.6 153 H 956.6 m -5 -4.5 l 5 4.5 l -5 4.5" fill="none" stroke="#6882a8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
