name: Refresh GitHub Signal SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "profile-signals"
  cancel-in-progress: true

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG cards from live GitHub API
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_signals.py

      - name: Commit updated SVG cards as bot (does not inflate user contributions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visuals/github-stats.svg assets/visuals/top-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(signals): refresh GitHub signal SVGs [skip ci]"
            git push
          fi
